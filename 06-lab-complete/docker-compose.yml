services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=staging
      - AGENT_API_KEY=${AGENT_API_KEY:-dev-secret-key}
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_PER_MINUTE=10
      - DAILY_BUDGET_USD=10.0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
